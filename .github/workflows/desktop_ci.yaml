# https://github.com/tauri-apps/tauri-action/blob/3013cac/examples/test-build-only.yml
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop_ci.yaml
      - apps/cli/**
      - apps/desktop/**
      - plugins/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - .github/workflows/desktop_ci.yaml
      - apps/cli/**
      - apps/desktop/**
      - plugins/**
      - crates/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  desktop_ci:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos"
            runner: "macos-15"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: pnpm -F ui build
      - run: pnpm -F desktop typecheck
      - run: pnpm -F desktop test
      - uses: ./.github/actions/install_desktop_deps
        with:
          target: ${{ matrix.platform }}
      - uses: ./.github/actions/rust_install
        with:
          platform: ${{ matrix.platform }}
      - if: matrix.platform == 'macos'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
      - run: cargo check --locked -p desktop
      - run: cargo test --locked -p desktop
      - run: |
          cargo test --locked --workspace \
            --exclude desktop \
            --exclude control-tauri \
            --exclude ai \
            --exclude email \
            --exclude lago \
            --exclude mac \
            --exclude notch \
            --exclude notification-macos \
            --exclude notification-macos2 \
            --exclude tcc \
            --exclude apple-note \
            --exclude notification-linux \
            --exclude am \
            --exclude aec \
            --exclude agc \
            --exclude whisper \
            --exclude whisper-local \
            --exclude whisper-local-model \
            --exclude vad2 \
            --exclude vad \
            --exclude vvad \
            --exclude vad-masking \
            --exclude vad-chunking \
            --exclude onnx \
            --exclude text-embedding \
            --exclude pyannote-local \
            --exclude llama \
            --exclude tools \
            --exclude docs \
            --exclude bundle \
            --exclude host \
            --exclude intercept \
            --exclude frontmatter \
            --exclude openstatus \
            --exclude audio \
            --exclude audio-device \
            --exclude transcribe-whisper-local \
            --exclude device-monitor \
            --exclude local-llm-core \
            --exclude local-stt-server \
            --exclude mobile-bridge \
            --exclude tauri-plugin-analytics\
            --exclude tauri-plugin-apple-calendar \
            --exclude tauri-plugin-audio-priority \
            --exclude tauri-plugin-auth \
            --exclude tauri-plugin-bedrock \
            --exclude tauri-plugin-db2 \
            --exclude tauri-plugin-deeplink2 \
            --exclude tauri-plugin-detect \
            --exclude tauri-plugin-fs-db \
            --exclude tauri-plugin-fs-sync \
            --exclude tauri-plugin-fs2 \
            --exclude tauri-plugin-hooks \
            --exclude tauri-plugin-icon \
            --exclude tauri-plugin-importer \
            --exclude tauri-plugin-js \
            --exclude tauri-plugin-listener \
            --exclude tauri-plugin-listener2 \
            --exclude tauri-plugin-local-llm \
            --exclude tauri-plugin-local-stt \
            --exclude tauri-plugin-misc \
            --exclude tauri-plugin-network \
            --exclude tauri-plugin-notification \
            --exclude tauri-plugin-notify \
            --exclude tauri-plugin-opener2 \
            --exclude tauri-plugin-overlay \
            --exclude tauri-plugin-path2 \
            --exclude tauri-plugin-pdf \
            --exclude tauri-plugin-permissions \
            --exclude tauri-plugin-screen \
            --exclude tauri-plugin-settings \
            --exclude tauri-plugin-sfx \
            --exclude tauri-plugin-sidecar2 \
            --exclude tauri-plugin-store2 \
            --exclude tauri-plugin-tantivy \
            --exclude tauri-plugin-template \
            --exclude tauri-plugin-tracing \
            --exclude tauri-plugin-tray \
            --exclude tauri-plugin-updater2 \
            --exclude tauri-plugin-webhook \
            --exclude tauri-plugin-windows \
            --exclude db3 \
            --exclude db-core \
            --exclude activity-capture-macos \
            --exclude tauri-plugin-activity-capture
      - run: |
          git diff --exit-code -- \
            plugins/db/js/bindings.gen.ts \
            plugins/db/permissions/autogenerated \
            plugins/db/permissions/schemas/schema.json

  desktop_i18n:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - run: pnpm -F desktop i18n:check

  desktop_swift:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - run: swift build --package-path plugins/windows/swift-lib

  # WS-F1 PR3: Linux coverage for crates the macOS workspace-test job excludes.
  # Lists derive from an empirical per-crate probe on Linux (2026-07-23, results
  # table in the PR): every crate below passed `cargo check --locked`; the test
  # list additionally passed its full test suite. Excluded-with-reason:
  # - db-core: covered by cli_ci (--lib); its e2e needs SQLITECLOUD_URL.
  # - email: its test asserts macOS-only behavior (check-only here).
  # - mobile-bridge, tauri-plugin-tantivy: tests FAIL on Linux today (latent —
  #   tantivy's test_english_stemmer_tokenizer; tracked as WS-F1 follow-ups).
  # - tauri-plugin-screen: check passes, test target does not compile on Linux.
  # - heavy native family (aec/agc/am/audio/audio-device/vad*/whisper*/
  #   pyannote-local/transcribe-whisper-local): probed green locally but kept
  #   out of the per-PR path for runner cost; candidates for a scheduled job.
  linux_crate_check:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      # Several excluded crates pull in tauri/gtk (glib-sys), which needs the
      # Linux desktop system libraries — same deps the macOS desktop job installs.
      - uses: ./.github/actions/install_desktop_deps
        with:
          target: linux
      - uses: ./.github/actions/rust_install
        with:
          platform: linux
      - name: Check wrongly-excluded crates (check-only tier)
        run: |
          cargo check --locked \
            -p onnx \
            -p db-core \
            -p email \
            -p mobile-bridge \
            -p tauri-plugin-tantivy \
            -p tauri-plugin-screen
      - name: Test wrongly-excluded crates (proven green on Linux)
        run: |
          cargo test --locked --no-fail-fast \
            -p device-monitor \
            -p frontmatter \
            -p host \
            -p intercept \
            -p local-llm-core \
            -p notification-linux \
            -p openstatus \
            -p tauri-plugin-analytics \
            -p tauri-plugin-audio-priority \
            -p tauri-plugin-auth \
            -p tauri-plugin-bedrock \
            -p tauri-plugin-deeplink2 \
            -p tauri-plugin-detect \
            -p tauri-plugin-fs2 \
            -p tauri-plugin-fs-sync \
            -p tauri-plugin-hooks \
            -p tauri-plugin-icon \
            -p tauri-plugin-importer \
            -p tauri-plugin-js \
            -p tauri-plugin-local-llm \
            -p tauri-plugin-local-stt \
            -p tauri-plugin-misc \
            -p tauri-plugin-notification \
            -p tauri-plugin-notify \
            -p tauri-plugin-opener2 \
            -p tauri-plugin-overlay \
            -p tauri-plugin-path2 \
            -p tauri-plugin-permissions \
            -p tauri-plugin-settings \
            -p tauri-plugin-sfx \
            -p tauri-plugin-sidecar2 \
            -p tauri-plugin-store2 \
            -p tauri-plugin-template \
            -p tauri-plugin-tracing \
            -p tauri-plugin-updater2 \
            -p tauri-plugin-webhook

  # WS-3: Windows coverage for the STT / dictation path.
  #
  # Until now this path was validated ONLY by manual field testing on real
  # hardware — which is how the D3 "Windows dies at 30s" class of bug shipped:
  # CI never compiled or ran these crates on Windows at all. This job closes
  # that gap by exercising the pure-logic STT/dictation crates (no GPU, no
  # model download at runtime) plus a compile-only check of the DirectML
  # engine path — the exact class of break that failed release rc1..rc5.
  #
  # The setup is modeled on the PROVEN windows-latest build in release.yaml
  # (`build-windows`): install-vulkan-sdk so whisper-rs-sys's cmake can link
  # the native STT crates, libclang for bindgen, rust_install(platform:
  # windows), and Ninja inside an MSVC dev environment.
  #
  # PROVISIONAL / NON-BLOCKING — this job is deliberately NOT in the `ci`
  # gate's `needs:` list below. It cannot be proven green from a Linux dev
  # box, so it must be OBSERVED green on real windows-latest runners across a
  # few PRs BEFORE being promoted to a required check. A provisional signal
  # is better than a required gate that is broken (or flaky) on day one.
  # Promotion checklist when it has been green for a while:
  #   1. add `windows_stt` to the `ci` job's `needs:` array;
  #   2. if `audio-chunking` / `transcribe-core` tests prove flaky on the
  #      runner (they pull ONNX Runtime / model-manager), demote them from
  #      the `cargo test` step to the `cargo check` step and keep testing the
  #      genuinely pure crates (owhisper-interface, vad-masking).
  windows_stt:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      CMAKE_GENERATOR: Ninja
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      # Sets VULKAN_SDK / PATH so whisper-rs-sys's cmake can find and link the
      # native STT crates (same pin as release.yaml build-windows).
      - uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true
      # libclang (bindgen) is preinstalled on windows-latest runners; install
      # it only if the image ever drops it (mirrors release.yaml build-windows).
      - shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y --no-progress
          }
      - uses: ./.github/actions/rust_install
        with:
          platform: windows
      # whisper.cpp's vulkan-shaders-gen nested CMake fails under the default
      # Visual Studio generator; Ninja inside an MSVC dev environment is the
      # proven fix (see release.yaml + docs/BUILDING.md).
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      # This job's `shell: bash` default routes every `run:` step through Git
      # Bash, whose MSYS2 launcher re-prepends its own `usr/bin` ahead of
      # whatever msvc-dev-cmd just added to PATH — so rustc's calls to
      # `link.exe` resolve to Git's POSIX hardlink utility instead of MSVC's
      # linker. Same interaction, same fix, as `cloudsync_from_source_windows`
      # (see docs/internal/sync-p2p.md §21.11/§21.12): delete Git's own
      # `link.exe` before any step that needs MSVC's.
      - name: Remove Git's link.exe (shadows MSVC's link.exe under Git Bash)
        run: rm -f /usr/bin/link.exe
      # Compile the STT/dictation pure-logic crates on Windows. `vad` is
      # check-only here: its dev-dependencies pull ONNX Runtime (hypr-onnx),
      # so `cargo test -p vad` would drag the ort runtime download into the
      # test step; `cargo check` compiles the crate itself (default = no
      # features -> pure logic) without that cost.
      - name: cargo check — STT/dictation crates
        run: |
          cargo check --locked \
            -p owhisper-interface \
            -p transcribe-core \
            -p audio-chunking \
            -p vad \
            -p vad-masking
      # Run the STT/dictation crate tests. owhisper-interface and vad-masking
      # are genuinely pure (no GPU, no model). audio-chunking (default = ["vad"])
      # and transcribe-core pull ONNX Runtime / model-manager at build time and
      # their tests construct a Silero VAD, so they are NOT model-free — they
      # are included per WS-3's "at minimum" list and are the first candidates
      # to demote to the check step if they prove flaky on the runner (see the
      # promotion checklist above).
      - name: cargo test — STT/dictation crates
        run: |
          cargo test --locked \
            -p owhisper-interface \
            -p transcribe-core \
            -p audio-chunking \
            -p vad-masking
      # Compile-only proof of the Windows-only DirectML engine path
      # (Parakeet / ONNX Runtime) — the class of break (a Windows-only feature
      # that stops compiling) that failed release rc1..rc5. No model download,
      # CPU fallback at runtime.
      - name: cargo check --features directml — parakeet-onnx crate
        run: |
          cargo check --locked --features directml -p parakeet-onnx
      # The plugin's Parakeet/DirectML integration only compiles when the
      # `parakeet-onnx` feature is ALSO enabled: `directml` forwards to
      # `hypr-parakeet-onnx?/directml` (note the `?`), which is a no-op unless
      # `parakeet-onnx` has already activated that optional dependency. Enabling
      # `directml` alone would silently skip the exact Parakeet code path this
      # step exists to protect. This pulls whisper.cpp too (directml -> whisper-cpp),
      # so it needs the D:\nb target dir to dodge Windows MAX_PATH on the nested
      # vulkan-shaders-gen dirs (same fix as release.yaml build-windows).
      - name: cargo check --features parakeet-onnx,directml — tauri-plugin-local-stt
        env:
          CARGO_TARGET_DIR: 'D:\nb'
        run: |
          cargo check --locked --features parakeet-onnx,directml -p tauri-plugin-local-stt

  # SYNC-9: prove `cloudsync --features from-source` actually compiles on the
  # platforms `crates/cloudsync/build.rs`'s `supported()` now claims, beyond
  # linux/x86_64. `from-source` is default-OFF (deliberately — see
  # docs/internal/sync-p2p.md §15.2b), so no existing job has ever built this
  # C code anywhere but Linux; widening `supported()` without this coverage
  # would just move an untested claim into the docs. Deliberately NOT a full
  # app build — `cargo check -p cloudsync --features from-source` alone drives
  # build.rs through the real compile-and-link of the vendored C sources plus
  # build/network_p2p.c (cargo runs build scripts for `check`, not just
  # `build`), so this is a genuine compile+link proof, not a Rust-only
  # typecheck. The feature is NOT enabled for any other job in this file.
  #
  # macOS: builds natively for aarch64 (macos-15 runners are Apple Silicon)
  # and cross-compiles the x86_64 check via `--target`, using the same clang
  # driver — both targets `supported()` now admits.
  cloudsync_from_source_macos:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust_install
        with:
          platform: macos
      - run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
      - name: cargo check -p cloudsync --features from-source (aarch64-apple-darwin, native)
        run: cargo check --locked -p cloudsync --features from-source --target aarch64-apple-darwin
      - name: cargo check -p cloudsync --features from-source (x86_64-apple-darwin, cross)
        run: cargo check --locked -p cloudsync --features from-source --target x86_64-apple-darwin

  # SYNC-9: same proof for Windows — the platform where `build/network_p2p.c`
  # needed real Winsock2 changes (SOCKET/closesocket/WSAStartup, not just a
  # `supported()` toggle), and where `build.rs`'s link step must drive
  # `cl.exe /LD` instead of `-shared` (this runner uses the MSVC toolchain,
  # per rust_install's `x86_64-pc-windows-msvc` target — matches windows_stt's
  # proven setup below).
  #
  # PROVISIONAL / NON-BLOCKING, same reasoning as `windows_stt`: this exact
  # code path has never run on a real Windows runner, so it cannot be proven
  # green from a Linux dev box (see docs/internal/sync-p2p.md §21 for exactly
  # what is and is not locally verified). It must be OBSERVED green on
  # windows-latest across a few PRs before being promoted to a required check.
  # Promotion checklist: add `cloudsync_from_source_windows` (and
  # `cloudsync_from_source_macos`, once likewise observed) to the `ci` job's
  # `needs:` array below.
  cloudsync_from_source_windows:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      # msvc-dev-cmd runs BEFORE rust_install, and this job no longer sets
      # CC/CXX: cl. Run 33410001375 showed rust_install's own embedded
      # `cargo install trusted-signing-cli` step (unconditional on
      # platform == 'windows', unrelated to this job) failing with cc-rs's
      # `ToolNotFound: failed to find tool "cl"` — and windows_stt hit the
      # identical failure at the identical step in the same run. Confirmed
      # from both jobs' logs, not a transient runner/network wobble: both
      # jobs set `CC`/`CXX: cl` at the job level, which overrides cc-rs's own
      # MSVC-registry auto-detection and forces a bare `cl` lookup on PATH —
      # and PATH has no cl.exe until msvc-dev-cmd runs, which in both jobs
      # came AFTER rust_install. Dropping the CC/CXX override restores
      # cc-rs's normal auto-detection (which does not need PATH pre-seeded);
      # moving msvc-dev-cmd first is a second, independent guarantee that
      # cl.exe is already on PATH for every later step, including
      # rust_install's embedded trusted-signing-cli install.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      # Run 33411261329 (after the fix above) got past cc-rs's tool lookup and
      # hit a second, different bug: rustc's own call to `link.exe` resolved
      # to Git for Windows' `/usr/bin/link.exe` (a POSIX hardlink utility, not
      # a linker) instead of MSVC's, because this job's `shell: bash` steps
      # run under Git Bash, whose own MSYS2 launcher re-prepends its `usr/bin`
      # ahead of whatever msvc-dev-cmd added to PATH — a documented
      # ilammy/msvc-dev-cmd + Git-Bash interaction, not something GITHUB_PATH
      # ordering can fix. Confirmed from the log's literal error text
      # (`"/usr/bin/link: extra operand '...cgu.0.rcgu.o'"` — Git's `link`
      # tool treats the linker's own arguments as file operands). The release
      # workflow's actually-proven Windows build (`release.yaml:build-windows`,
      # which `windows_stt`'s header comment claims to be modeled on but is
      # not, in this respect) never hits this because it does not set
      # `shell: bash` at all and does not use `rust_install`.
      #
      # First attempt (run 33411261329): `rm -f /usr/bin/link.exe` before
      # `rust_install`. This looked like it worked — `rust_install`'s own
      # embedded step went green — but run 33415114684 proved it was not a
      # real fix: this job's OWN `cargo check -p cloudsync` step, later in
      # the SAME job, hit the identical `"C:\Program Files\Git\usr\bin\link.exe"`
      # error again, for the exact same crates (quote/proc-macro2/typenum). A
      # deleted file cannot reappear mid-job on the same filesystem, so
      # `rm -f` most likely never actually removed it — `Program Files`
      # permissions plus `-f` silently swallowing the failure is the leading
      # explanation — and `rust_install`'s step probably only "passed" that
      # run because Swatinem/rust-cache happened to restore already-linked
      # artifacts for `trusted-signing-cli`'s shared deps, sidestepping a
      # fresh link rather than proving the underlying PATH problem gone.
      #
      # Real fix: stop trying to make PATH resolve to the right `link.exe`
      # under Git Bash at all. Point cargo at it by absolute path instead,
      # via the standard `CARGO_TARGET_<TRIPLE>_LINKER` env var, which every
      # `cargo`/`rustc` invocation in this job honors regardless of which
      # shell launched it or what PATH that shell computed — including
      # `rust_install`'s embedded `cargo install trusted-signing-cli` step,
      # since it's exported to the whole job via `$GITHUB_ENV` right here,
      # immediately after `msvc-dev-cmd` populates PATH with the real MSVC
      # toolchain and before Git Bash gets a chance to re-derive PATH for a
      # later step's fresh shell.
      - name: Pin cargo to MSVC's link.exe by absolute path (bypasses PATH search)
        run: |
          # Audit finding (auditor, coder=claude-sonnet-5, gpt-oss seat,
          # confirmed real): `for dir in $(...)` word-splits on ALL of IFS
          # (space/tab/newline), not just the `\n` `tr` produced — so a PATH
          # entry with a space (e.g. `C:\Program Files\Microsoft Visual
          # Studio\...`, which is exactly where MSVC's link.exe lives) would
          # silently split into two bogus entries and never match. `IFS=$'\n'
          # read -d ''` splits on newline only, leaving each entry's spaces
          # intact.
          IFS=$'\n' read -d '' -ra path_dirs < <(echo "$PATH" | tr ':' '\n') || true
          for dir in "${path_dirs[@]}"; do
            # Audit finding (minimax seat): also require the directory to
            # look like an actual MSVC/Windows SDK toolchain path, not just
            # "not Git" — defensive in case some other non-Git, non-MSVC
            # `link.exe` ever ends up on PATH ahead of the real one.
            if [ -f "$dir/link.exe" ] && [[ "$dir" != *"/Git/"* ]] \
              && [[ "$dir" == *"Microsoft Visual Studio"* || "$dir" == *"Windows Kits"* ]]; then
              echo "found MSVC link.exe: $dir/link.exe"
              echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$dir/link.exe" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::no MSVC link.exe found on PATH after msvc-dev-cmd" >&2
          exit 1
      - uses: ./.github/actions/rust_install
        with:
          platform: windows
      - name: cargo check -p cloudsync --features from-source
        run: cargo check --locked -p cloudsync --features from-source

  # linux/aarch64 is the last target `crates/cloudsync/build.rs`'s `supported()`
  # admits that nothing has ever compiled (§21.7 records it as an untested
  # claim, and §22 excludes it from the app gate for exactly that reason).
  # GitHub's `ubuntu-24.04-arm` runners are free for public repos, so the claim
  # is cheap to settle rather than carry.
  #
  # Native aarch64, no cross-compilation: the point is to compile the vendored
  # C on a real arm64 Linux host, which is where a POSIX/arch assumption would
  # surface (the same class of bug that produced the macOS `Security.framework`
  # and Windows `bcrypt.lib` link failures).
  #
  # PROVISIONAL / NON-BLOCKING, same policy as the other cloudsync jobs: it
  # must be OBSERVED green on its real runner before promotion. If it passes,
  # the follow-up is to widen `build-support/sync_app_gate.rs` and the two
  # Cargo.toml tables that mirror it to admit linux/aarch64 — do NOT widen
  # them on the strength of this job's existence alone.
  cloudsync_from_source_linux_arm:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust_install
        with:
          platform: linux-aarch64
      - name: cargo check -p cloudsync --features from-source (aarch64-unknown-linux-gnu, native)
        run: cargo check --locked -p cloudsync --features from-source

  # App-gate widening (docs/internal/sync-p2p.md §22): the two
  # `cloudsync_from_source_*` jobs above only prove the standalone `cloudsync`
  # crate compiles+links off Linux. `plugins/db/Cargo.toml` and
  # `apps/desktop/src-tauri/Cargo.toml` used to gate `sync-p2p`/`hypr-cloudsync`
  # to `cfg(all(target_os = "linux", target_arch = "x86_64"))` — so even with
  # `supported()` widened, the shipped DESKTOP APP never pulled those deps in
  # on macOS/Windows at all (§21.8's "next required step"). Those tables now
  # admit macOS (both arches) and windows/x86_64 too (matching
  # `build-support/sync_app_gate.rs`'s `sync_platform` cfg, which
  # `plugins/db`'s and `desktop`'s Rust code is gated on); this job is the CI
  # proof that the app itself — not just the vendored C crate — compiles with
  # `--features sync` there.
  #
  # linux/aarch64 is deliberately EXCLUDED from this gate even though
  # `crates/cloudsync/build.rs`'s `supported()` admits it: no CI job and no
  # local toolchain have ever compiled anything against it (§21.7). Widen
  # `build-support/sync_app_gate.rs` (and the two Cargo.toml tables that
  # mirror it) only once that changes.
  #
  # Deliberately `cargo check`, not `tauri build` / an MSI/dmg bundle — cheap
  # relative to release.yaml's full build, while still compiling every line
  # of the sync-gated code (plugins/db/src/{lib,runtime,commands,sync}.rs,
  # apps/desktop/src-tauri/src/lib.rs's `start_sync`/`shutdown_sync`) for real,
  # because `cargo check` still runs build scripts (so cloudsync's from-source
  # C build is genuinely exercised as a dependency of the full desktop crate,
  # not just standalone).
  desktop_sync_gate_macos:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: pnpm -F ui build
      - uses: ./.github/actions/install_desktop_deps
        with:
          target: macos
      - uses: ./.github/actions/rust_install
        with:
          platform: macos
      - run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
      - name: cargo check -p desktop --features sync
        run: cargo check --locked -p desktop --features sync

  # Same proof as `desktop_sync_gate_macos`, for Windows. Needs the same
  # Vulkan SDK / libclang setup as `windows_stt` — the desktop crate's default
  # features pull in `tauri-plugin-local-stt`'s whisper.cpp/ONNX/Voxtral
  # engines unconditionally on windows regardless of the `sync` feature (see
  # apps/desktop/src-tauri/Cargo.toml's `cfg(any(target_os = "linux",
  # target_os = "windows"))` dependency table) — plus `CC`/`CXX: cl` and
  # `CMAKE_GENERATOR: Ninja`, the combination `release.yaml`'s actually-proven
  # `build-windows` job uses for whisper.cpp's CMake build on Windows.
  #
  # Ordering follows the FIXED shape from `cloudsync_from_source_windows`
  # (docs/internal/sync-p2p.md §21.10-§21.12), not `windows_stt`'s (which has
  # never been observed reaching its own `cargo` step): `msvc-dev-cmd` runs
  # BEFORE `rust_install`, so `PATH` already has a real `cl.exe` by the time
  # any cargo/build-script invocation happens even with `CC=cl` set at job
  # level, and the linker is pinned by absolute path
  # (`CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER`) rather than relying on
  # `PATH` search order surviving a fresh Git Bash shell — the `rm -f
  # /usr/bin/link.exe` approach was tried and proven NOT reliable (§21.12).
  #
  # PROVISIONAL / NON-BLOCKING, same reasoning as the two
  # `cloudsync_from_source_*` jobs and `windows_stt`: this exact combination
  # (full desktop crate + `sync` feature, on Windows) has never run on a real
  # runner, so it cannot be proven green from a Linux dev box. Promote
  # alongside the other provisional jobs once observed green across a few PRs.
  desktop_sync_gate_windows:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      CMAKE_GENERATOR: Ninja
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - run: pnpm -F ui build
      - uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true
      - shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y --no-progress
          }
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Pin cargo to MSVC's link.exe by absolute path (bypasses PATH search)
        run: |
          IFS=$'\n' read -d '' -ra path_dirs < <(echo "$PATH" | tr ':' '\n') || true
          for dir in "${path_dirs[@]}"; do
            if [ -f "$dir/link.exe" ] && [[ "$dir" != *"/Git/"* ]] \
              && [[ "$dir" == *"Microsoft Visual Studio"* || "$dir" == *"Windows Kits"* ]]; then
              echo "found MSVC link.exe: $dir/link.exe"
              echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$dir/link.exe" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::no MSVC link.exe found on PATH after msvc-dev-cmd" >&2
          exit 1
      - uses: ./.github/actions/rust_install
        with:
          platform: windows
      - name: cargo check -p desktop --features sync
        run: cargo check --locked -p desktop --features sync

  ci:
    if: always()
    # `windows_stt` and the two `cloudsync_from_source_*` jobs are now REQUIRED:
    # each has been observed green on its real runner across several PRs
    # (#142, #143 and the dispatch runs recorded in docs/internal/sync-p2p.md
    # §21.10–§21.17), which is the promotion bar the comments on those jobs set.
    #
    # Promoting these is the whole point of having them. `windows_stt` sat red
    # on `main` for an extended period precisely because nothing blocked on it,
    # and that masked two stacked CI-plumbing bugs AND three genuine
    # portability defects (§21.11–§21.16). A non-blocking job that nobody reads
    # is not a signal.
    #
    # The two `desktop_sync_gate_*` jobs and `cloudsync_from_source_linux_arm`
    # have now cleared that same bar and are promoted here. Observed via
    # `gh api .../actions/runs/<id>/jobs` over the last 12 `desktop_ci` runs:
    #
    #   desktop_sync_gate_macos    12 green, 0 red — PRs #143, #149, #150,
    #   desktop_sync_gate_windows  #152, #153, #154 plus 4 post-merge `main`
    #                              pushes (6 distinct PRs)
    #   cloudsync_from_source_linux_arm  7 green, 0 red — PRs #149, #150, #154
    #                              plus 3 `main` pushes (3 distinct PRs)
    #
    # Neither has ever gone red on a real runner. §22.8's "promote after a few
    # more PRs, not after a single run" is satisfied for all three.
    needs:
      [
        desktop_ci,
        desktop_i18n,
        desktop_swift,
        linux_crate_check,
        windows_stt,
        cloudsync_from_source_macos,
        cloudsync_from_source_windows,
        cloudsync_from_source_linux_arm,
        desktop_sync_gate_macos,
        desktop_sync_gate_windows,
      ]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
