# https://github.com/tauri-apps/tauri-action/blob/3013cac/examples/test-build-only.yml
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop_ci.yaml
      - .github/actions/**
      - apps/cli/**
      - apps/desktop/**
      - plugins/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
  # Every PR runs this workflow so the required `ci` check below is the only
  # one and exists for every commit; `changes` decides what actually runs.
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Push/dispatch are already path-filtered by their triggers.
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/desktop_ci.yaml'
              - '.github/actions/**'
              - 'apps/cli/**'
              - 'apps/desktop/**'
              - 'plugins/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  desktop_ci:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos"
            runner: "macos-15"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: pnpm -F ui build
      - run: pnpm -F desktop typecheck
      - run: pnpm -F desktop test
      - uses: ./.github/actions/install_desktop_deps
        with:
          target: ${{ matrix.platform }}
      - uses: ./.github/actions/rust_install
        with:
          platform: ${{ matrix.platform }}
      - if: matrix.platform == 'macos'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
      - run: cargo check --locked -p desktop
      - run: cargo test --locked -p desktop
      - run: |
          cargo test --locked --workspace \
            --exclude desktop \
            --exclude control-tauri \
            --exclude ai \
            --exclude email \
            --exclude lago \
            --exclude mac \
            --exclude notch \
            --exclude notification-macos \
            --exclude notification-macos2 \
            --exclude tcc \
            --exclude apple-note \
            --exclude notification-linux \
            --exclude am \
            --exclude aec \
            --exclude agc \
            --exclude whisper \
            --exclude whisper-local \
            --exclude whisper-local-model \
            --exclude vad2 \
            --exclude vad \
            --exclude vvad \
            --exclude vad-masking \
            --exclude vad-chunking \
            --exclude onnx \
            --exclude text-embedding \
            --exclude pyannote-local \
            --exclude llama \
            --exclude tools \
            --exclude docs \
            --exclude bundle \
            --exclude host \
            --exclude intercept \
            --exclude frontmatter \
            --exclude openstatus \
            --exclude audio \
            --exclude audio-device \
            --exclude transcribe-whisper-local \
            --exclude device-monitor \
            --exclude local-llm-core \
            --exclude local-stt-server \
            --exclude mobile-bridge \
            --exclude tauri-plugin-analytics\
            --exclude tauri-plugin-apple-calendar \
            --exclude tauri-plugin-audio-priority \
            --exclude tauri-plugin-auth \
            --exclude tauri-plugin-bedrock \
            --exclude tauri-plugin-db2 \
            --exclude tauri-plugin-deeplink2 \
            --exclude tauri-plugin-detect \
            --exclude tauri-plugin-fs-db \
            --exclude tauri-plugin-fs-sync \
            --exclude tauri-plugin-fs2 \
            --exclude tauri-plugin-hooks \
            --exclude tauri-plugin-icon \
            --exclude tauri-plugin-importer \
            --exclude tauri-plugin-js \
            --exclude tauri-plugin-listener \
            --exclude tauri-plugin-listener2 \
            --exclude tauri-plugin-local-llm \
            --exclude tauri-plugin-local-stt \
            --exclude tauri-plugin-misc \
            --exclude tauri-plugin-network \
            --exclude tauri-plugin-notification \
            --exclude tauri-plugin-notify \
            --exclude tauri-plugin-opener2 \
            --exclude tauri-plugin-overlay \
            --exclude tauri-plugin-path2 \
            --exclude tauri-plugin-pdf \
            --exclude tauri-plugin-permissions \
            --exclude tauri-plugin-screen \
            --exclude tauri-plugin-settings \
            --exclude tauri-plugin-sfx \
            --exclude tauri-plugin-sidecar2 \
            --exclude tauri-plugin-store2 \
            --exclude tauri-plugin-tantivy \
            --exclude tauri-plugin-template \
            --exclude tauri-plugin-tracing \
            --exclude tauri-plugin-tray \
            --exclude tauri-plugin-updater2 \
            --exclude tauri-plugin-webhook \
            --exclude tauri-plugin-windows \
            --exclude db3 \
            --exclude db-core \
            --exclude activity-capture-macos \
            --exclude tauri-plugin-activity-capture
      - run: |
          cargo test --locked -p tauri-plugin-local-llm export_types
          cargo test --locked -p tauri-plugin-local-stt export_types
      - run: |
          git diff --exit-code -- \
            plugins/db/js/bindings.gen.ts \
            plugins/db/permissions/autogenerated \
            plugins/db/permissions/schemas/schema.json \
            plugins/local-llm/js/bindings.gen.ts \
            plugins/local-stt/js/bindings.gen.ts

  desktop_i18n:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - run: pnpm -F desktop i18n:check

  desktop_swift:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - run: swift build --package-path plugins/windows/swift-lib

  # WS-F1 PR3: Linux coverage for crates the macOS workspace-test job excludes.
  # Lists derive from an empirical per-crate probe on Linux (2026-07-23, results
  # table in the PR): every crate below passed `cargo check --locked`; the test
  # list additionally passed its full test suite. Excluded-with-reason:
  # - db-core: covered by cli_ci.
  # - email: its test asserts macOS-only behavior (check-only here).
  # - mobile-bridge, tauri-plugin-tantivy: tests FAIL on Linux today (latent —
  #   tantivy's test_english_stemmer_tokenizer; tracked as WS-F1 follow-ups).
  # - tauri-plugin-screen: check passes, test target does not compile on Linux.
  # - heavy native family (aec/agc/am/audio/audio-device/vad*/whisper*/
  #   pyannote-local/transcribe-whisper-local): probed green locally but kept
  #   out of the per-PR path for runner cost; candidates for a scheduled job.
  linux_crate_check:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # Several excluded crates pull in tauri/gtk (glib-sys), which needs the
      # Linux desktop system libraries — same deps the macOS desktop job installs.
      - uses: ./.github/actions/install_desktop_deps
        with:
          target: linux
      - uses: ./.github/actions/rust_install
        with:
          platform: linux
      - name: Check wrongly-excluded crates (check-only tier)
        run: |
          cargo check --locked \
            -p onnx \
            -p db-core \
            -p email \
            -p mobile-bridge \
            -p tauri-plugin-tantivy \
            -p tauri-plugin-screen
      - name: Test wrongly-excluded crates (proven green on Linux)
        run: |
          cargo test --locked --no-fail-fast \
            -p device-monitor \
            -p frontmatter \
            -p host \
            -p intercept \
            -p local-llm-core \
            -p notification-linux \
            -p openstatus \
            -p tauri-plugin-analytics \
            -p tauri-plugin-audio-priority \
            -p tauri-plugin-auth \
            -p tauri-plugin-bedrock \
            -p tauri-plugin-deeplink2 \
            -p tauri-plugin-detect \
            -p tauri-plugin-fs2 \
            -p tauri-plugin-fs-sync \
            -p tauri-plugin-hooks \
            -p tauri-plugin-icon \
            -p tauri-plugin-importer \
            -p tauri-plugin-js \
            -p tauri-plugin-local-llm \
            -p tauri-plugin-local-stt \
            -p tauri-plugin-misc \
            -p tauri-plugin-notification \
            -p tauri-plugin-notify \
            -p tauri-plugin-opener2 \
            -p tauri-plugin-overlay \
            -p tauri-plugin-path2 \
            -p tauri-plugin-permissions \
            -p tauri-plugin-settings \
            -p tauri-plugin-sfx \
            -p tauri-plugin-sidecar2 \
            -p tauri-plugin-store2 \
            -p tauri-plugin-template \
            -p tauri-plugin-tracing \
            -p tauri-plugin-updater2 \
            -p tauri-plugin-webhook

  # WS-3: Windows coverage for the STT / dictation path.
  #
  # Until now this path was validated ONLY by manual field testing on real
  # hardware — which is how the D3 "Windows dies at 30s" class of bug shipped:
  # CI never compiled or ran these crates on Windows at all. This job closes
  # that gap by exercising the pure-logic STT/dictation crates (no GPU, no
  # model download at runtime) plus a compile-only check of the DirectML
  # engine path — the exact class of break that failed release rc1..rc5.
  #
  # The setup is modeled on the PROVEN windows-latest build in release.yaml
  # (`build-windows`): install-vulkan-sdk so whisper-rs-sys's cmake can link
  # the native STT crates, libclang for bindgen, rust_install(platform:
  # windows), and Ninja inside an MSVC dev environment.
  #
  # PROVISIONAL / NON-BLOCKING — this job is deliberately NOT in the `ci`
  # gate's `needs:` list below. It cannot be proven green from a Linux dev
  # box, so it must be OBSERVED green on real windows-latest runners across a
  # few PRs BEFORE being promoted to a required check. A provisional signal
  # is better than a required gate that is broken (or flaky) on day one.
  # Promotion checklist when it has been green for a while:
  #   1. add `windows_stt` to the `ci` job's `needs:` array;
  #   2. if `audio-chunking` / `transcribe-core` tests prove flaky on the
  #      runner (they pull ONNX Runtime / model-manager), demote them from
  #      the `cargo test` step to the `cargo check` step and keep testing the
  #      genuinely pure crates (owhisper-interface, vad-masking).
  windows_stt:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      CMAKE_GENERATOR: Ninja
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      # Sets VULKAN_SDK / PATH so whisper-rs-sys's cmake can find and link the
      # native STT crates (same pin as release.yaml build-windows).
      - uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true
      # libclang (bindgen) is preinstalled on windows-latest runners; install
      # it only if the image ever drops it (mirrors release.yaml build-windows).
      - shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y --no-progress
          }
      - uses: ./.github/actions/rust_install
        with:
          platform: windows
      # whisper.cpp's vulkan-shaders-gen nested CMake fails under the default
      # Visual Studio generator; Ninja inside an MSVC dev environment is the
      # proven fix (see release.yaml + docs/BUILDING.md).
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      # This job's `shell: bash` default routes every `run:` step through Git
      # Bash, whose MSYS2 launcher re-prepends its own `usr/bin` ahead of
      # whatever msvc-dev-cmd just added to PATH — so rustc's calls to
      # `link.exe` resolve to Git's POSIX hardlink utility instead of MSVC's
      # linker: delete Git's own `link.exe` before any step that needs MSVC's.
      # (Not fully reliable — `desktop_sync_gate_windows` below pins the linker
      # by absolute path instead; see docs/internal/sync-p2p.md history.)
      - name: Remove Git's link.exe (shadows MSVC's link.exe under Git Bash)
        run: rm -f /usr/bin/link.exe
      # Compile the STT/dictation pure-logic crates on Windows. `vad` is
      # check-only here: its dev-dependencies pull ONNX Runtime (hypr-onnx),
      # so `cargo test -p vad` would drag the ort runtime download into the
      # test step; `cargo check` compiles the crate itself (default = no
      # features -> pure logic) without that cost.
      - name: cargo check — STT/dictation crates
        run: |
          cargo check --locked \
            -p owhisper-interface \
            -p transcribe-core \
            -p audio-chunking \
            -p vad \
            -p vad-masking
      # Run the STT/dictation crate tests. owhisper-interface and vad-masking
      # are genuinely pure (no GPU, no model). audio-chunking (default = ["vad"])
      # and transcribe-core pull ONNX Runtime / model-manager at build time and
      # their tests construct a Silero VAD, so they are NOT model-free — they
      # are included per WS-3's "at minimum" list and are the first candidates
      # to demote to the check step if they prove flaky on the runner (see the
      # promotion checklist above).
      - name: cargo test — STT/dictation crates
        run: |
          cargo test --locked \
            -p owhisper-interface \
            -p transcribe-core \
            -p audio-chunking \
            -p vad-masking
      # Compile-only proof of the Windows-only DirectML engine path
      # (Parakeet / ONNX Runtime) — the class of break (a Windows-only feature
      # that stops compiling) that failed release rc1..rc5. No model download,
      # CPU fallback at runtime.
      - name: cargo check --features directml — parakeet-onnx crate
        run: |
          cargo check --locked --features directml -p parakeet-onnx
      # The plugin's Parakeet/DirectML integration only compiles when the
      # `parakeet-onnx` feature is ALSO enabled: `directml` forwards to
      # `hypr-parakeet-onnx?/directml` (note the `?`), which is a no-op unless
      # `parakeet-onnx` has already activated that optional dependency. Enabling
      # `directml` alone would silently skip the exact Parakeet code path this
      # step exists to protect. This pulls whisper.cpp too (directml -> whisper-cpp),
      # so it needs the D:\nb target dir to dodge Windows MAX_PATH on the nested
      # vulkan-shaders-gen dirs (same fix as release.yaml build-windows).
      - name: cargo check --features parakeet-onnx,directml — tauri-plugin-local-stt
        env:
          CARGO_TARGET_DIR: 'D:\nb'
        run: |
          cargo check --locked --features parakeet-onnx,directml -p tauri-plugin-local-stt

  # 0.7 engine gate: EXECUTE the vendored cr-sqlite engine (vlcn-io v0.16.3
  # prebuilt binaries, embedded via include_bytes! and extracted to the cache
  # dir) on every `sync_platform` OS. `cargo test -p crsqlite` drives the
  # engine API (load, as_crr, pull/apply paging, LWW, tombstones); the
  # db-core test pins the pool teardown (finalize every connection before
  # sqlite3_close — an unfinalized close panics sqlx's worker threads). The
  # env-gated Phase 0 spike tests print "skipped" without
  # CRSQLITE_SPIKE_EXTENSION. Also settles whether an unsigned extracted
  # dylib loads under Gatekeeper and the Windows dll load, on real runners.
  #
  # No Vulkan/MSVC/llm machinery: these crates depend only on sqlx/sqlite and
  # the db crates, so a bare runner + rust toolchain suffices.
  crsqlite_gate_linux:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust_install
        with:
          platform: linux
      - name: cargo test -p crsqlite
        run: cargo test --locked -p crsqlite
      - name: cargo test -p db-core --features crsqlite --test crsqlite_close
        run: cargo test --locked -p db-core --features crsqlite --test crsqlite_close

  # macOS gate — same proof on macos-15 (aarch64). PROVISIONAL/NON-BLOCKING
  # until observed green across a few PRs (the promotion bar every other
  # provisional job here uses).
  crsqlite_gate_macos:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust_install
        with:
          platform: macos
      - name: cargo test -p crsqlite
        run: cargo test --locked -p crsqlite
      - name: cargo test -p db-core --features crsqlite --test crsqlite_close
        run: cargo test --locked -p db-core --features crsqlite --test crsqlite_close

  # Windows gate — same proof on windows-latest (x86_64). Same provisional
  # policy as crsqlite_gate_macos.
  crsqlite_gate_windows:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust_install
        with:
          platform: windows
      - name: cargo test -p crsqlite
        run: cargo test --locked -p crsqlite
      - name: cargo test -p db-core --features crsqlite --test crsqlite_close
        run: cargo test --locked -p db-core --features crsqlite --test crsqlite_close

  # App-gate proof (docs/internal/sync-p2p.md): `plugins/db/Cargo.toml` and
  # `apps/desktop/src-tauri/Cargo.toml` gate `sync-p2p`/`hypr-crsqlite` to
  # linux/x86_64, macOS (both arches) and windows/x86_64 (matching
  # `build-support/sync_app_gate.rs`'s `sync_platform` cfg, which
  # `plugins/db`'s and `desktop`'s Rust code is gated on); this job is the CI
  # proof that the app itself compiles with `--features sync` there.
  #
  # linux/aarch64 is deliberately EXCLUDED: `crates/crsqlite/vendor/` has no
  # engine for it and no CI job has ever compiled the app against it. Widen
  # `build-support/sync_app_gate.rs` (and the two Cargo.toml tables that
  # mirror it) only once that changes.
  #
  # Deliberately `cargo check`, not `tauri build` / an MSI/dmg bundle — cheap
  # relative to release.yaml's full build, while still compiling every line
  # of the sync-gated code (plugins/db/src/{lib,runtime,commands,sync}.rs,
  # apps/desktop/src-tauri/src/lib.rs's `start_sync`/`shutdown_sync`) for real.
  # Executing the vendored engine is the `crsqlite_gate_*` jobs' job.
  desktop_sync_gate_macos:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: pnpm -F ui build
      - uses: ./.github/actions/install_desktop_deps
        with:
          target: macos
      - uses: ./.github/actions/rust_install
        with:
          platform: macos
      - run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
      - name: cargo check -p desktop --features sync
        run: cargo check --locked -p desktop --features sync

  # Same proof as `desktop_sync_gate_macos`, for Windows. Needs the same
  # Vulkan SDK / libclang setup as `windows_stt` — the desktop crate's default
  # features pull in `tauri-plugin-local-stt`'s whisper.cpp/ONNX/Voxtral
  # engines unconditionally on windows regardless of the `sync` feature (see
  # apps/desktop/src-tauri/Cargo.toml's `cfg(any(target_os = "linux",
  # target_os = "windows"))` dependency table) — plus `CC`/`CXX: cl` and
  # `CMAKE_GENERATOR: Ninja`, the combination `release.yaml`'s actually-proven
  # `build-windows` job uses for whisper.cpp's CMake build on Windows.
  #
  # Ordering: `msvc-dev-cmd` runs BEFORE `rust_install`, so `PATH` already has
  # a real `cl.exe` by the time any cargo/build-script invocation happens even
  # with `CC=cl` set at job level (`windows_stt`'s order has never been
  # observed reaching its own `cargo` step), and the linker is pinned by
  # absolute path (`CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER`) rather than
  # relying on `PATH` search order surviving a fresh Git Bash shell — the
  # `rm -f /usr/bin/link.exe` approach was tried and proven NOT reliable.
  #
  # PROVISIONAL / NON-BLOCKING, same reasoning as `windows_stt`: this exact
  # combination (full desktop crate + `sync` feature, on Windows) cannot be
  # proven green from a Linux dev box. Promote alongside the other
  # provisional jobs once observed green across a few PRs.
  desktop_sync_gate_windows:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      CMAKE_GENERATOR: Ninja
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - run: pnpm -F ui build
      - uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true
      - shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y --no-progress
          }
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Pin cargo to MSVC's link.exe by absolute path (bypasses PATH search)
        run: |
          IFS=$'\n' read -d '' -ra path_dirs < <(echo "$PATH" | tr ':' '\n') || true
          for dir in "${path_dirs[@]}"; do
            if [ -f "$dir/link.exe" ] && [[ "$dir" != *"/Git/"* ]] \
              && [[ "$dir" == *"Microsoft Visual Studio"* || "$dir" == *"Windows Kits"* ]]; then
              echo "found MSVC link.exe: $dir/link.exe"
              echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$dir/link.exe" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::no MSVC link.exe found on PATH after msvc-dev-cmd" >&2
          exit 1
      - uses: ./.github/actions/rust_install
        with:
          platform: windows
      - name: cargo check -p desktop --features sync
        run: cargo check --locked -p desktop --features sync

  # LLM-EMBED: prove the embedded local LLM server (llama-cpp-2, restored
  # after the Cactus removal) actually compiles on every platform it
  # claims — not reasoning about it. SYNC-9 widened a `supported()`
  # predicate on reasoning alone and its first real CI run failed instantly
  # on undefined `_SecRandomCopyBytes` on macOS; a `cargo check` job per
  # claimed platform is what closes that exact gap here.
  #
  # Linux is the cheapest and only NATIVELY-provable-from-this-box target
  # (this job's own runner), so it gets both the CPU and the Vulkan variant.
  # `local-llm-cuda` is NOT checked anywhere — same reasoning as
  # `voxtral-cuda` above: requires the CUDA toolkit + a matching driver,
  # which no CI runner here has, so it's manual-validation-only.
  local_llm_gate_linux:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/install_desktop_deps
        with:
          target: linux
      - uses: ./.github/actions/rust_install
        with:
          platform: linux
      - name: cargo test -p local-llm-core --features llama
        run: cargo test --locked -p local-llm-core --features llama
      - name: cargo check -p desktop --features local-llm
        run: cargo check --locked -p desktop --features local-llm
      # Vulkan build deps: loader headers for find_package(Vulkan) + glslc
      # for shader compilation.
      #
      # `spirv-headers` is NOT part of desktop_test_build.yaml's gpu-vulkan
      # set, and its absence is what made this job's first real run fail
      # (run 33625122350): llama.cpp's `ggml/src/ggml-vulkan/CMakeLists.txt:14`
      # does `find_package(SPIRV-Headers)`, which whisper.cpp's Vulkan path
      # never needed, so copying that dep list was not sufficient here. The
      # package name is confirmed rather than guessed — on the dev box where
      # this build succeeds, `dpkg -S` attributes
      # /usr/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake to
      # `spirv-headers`.
      - run: sudo apt-get install -y libvulkan-dev glslc spirv-headers
      - name: cargo check -p desktop --features local-llm-vulkan
        run: cargo check --locked -p desktop --features local-llm-vulkan

  # No Vulkan/CUDA variant claimed on macOS (neither is offered on this
  # platform; see apps/desktop/src-tauri/Cargo.toml's
  # `local-llm-vulkan`/`voxtral-cuda` doc comments).
  local_llm_gate_macos:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: pnpm -F ui build
      - uses: ./.github/actions/install_desktop_deps
        with:
          target: macos
      - uses: ./.github/actions/rust_install
        with:
          platform: macos
      - run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
      - name: cargo check -p desktop --features local-llm
        run: cargo check --locked -p desktop --features local-llm

  # Reuses the exact Vulkan SDK / libclang / MSVC-linker-pinning setup already
  # proven for `windows_stt`/`desktop_sync_gate_windows` (see that job's
  # comments for why each step is ordered the way it is).
  local_llm_gate_windows:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      CMAKE_GENERATOR: Ninja
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - run: pnpm -F ui build
      - uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true
      - shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y --no-progress
          }
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Pin cargo to MSVC's link.exe by absolute path (bypasses PATH search)
        run: |
          IFS=$'\n' read -d '' -ra path_dirs < <(echo "$PATH" | tr ':' '\n') || true
          for dir in "${path_dirs[@]}"; do
            if [ -f "$dir/link.exe" ] && [[ "$dir" != *"/Git/"* ]] \
              && [[ "$dir" == *"Microsoft Visual Studio"* || "$dir" == *"Windows Kits"* ]]; then
              echo "found MSVC link.exe: $dir/link.exe"
              echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$dir/link.exe" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::no MSVC link.exe found on PATH after msvc-dev-cmd" >&2
          exit 1
      - uses: ./.github/actions/rust_install
        with:
          platform: windows
      - name: cargo check -p desktop --features local-llm
        run: cargo check --locked -p desktop --features local-llm
      # NO `local-llm-vulkan` step here, deliberately. Its first real run
      # (run 33625122350) failed at llama.cpp's
      # `ggml/src/ggml-vulkan/CMakeLists.txt:14` —
      # `find_package(SPIRV-Headers)` — the same root cause as the Linux
      # failure, but the Linux fix does not transfer: LunarG's SDK is
      # installed here (VULKAN_SDK was set correctly), and this action pulls
      # a minimal component set that evidently carries no
      # SPIRV-HeadersConfig.cmake.
      #
      # Resolving it means locating (or installing) that package config on a
      # real Windows runner — either an extra SDK component or a
      # CMAKE_PREFIX_PATH/SPIRV-Headers_DIR pointing into the SDK. Which of
      # those works cannot be determined from here, and §21.10 is the
      # standing lesson against changing a build command on inference: that
      # cost seven CI runs the last time it was tried. So the Windows claim
      # is narrowed to the plain `local-llm` check, which passes, rather than
      # left as a permanently-red job — a red job nobody can act on is the
      # anti-pattern the `ci` comment below is about.

  ci:
    if: always()
    # LLM gates promoted on 10 consecutive green `main` runs (`34098319471` back
    # to `33504523083`, 2026-09-01→09-07).
    #
    # The two sync jobs (`desktop_sync_gate_macos`, `desktop_sync_gate_windows`)
    # stay outside `needs` by decision (sync deferred), not for lack of runs.
    needs:
      [
        changes,
        desktop_ci,
        desktop_i18n,
        desktop_swift,
        linux_crate_check,
        windows_stt,
        local_llm_gate_linux,
        local_llm_gate_macos,
        local_llm_gate_windows,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Path detection must succeed
        if: needs.changes.result != 'success'
        run: exit 1
      # When code changed, a skipped required job is a failure too: nothing
      # may pass this check without having run.
      - name: Every required job must succeed
        if: >-
          needs.changes.outputs.code == 'true' && (
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled') ||
            contains(needs.*.result, 'skipped')
          )
        run: exit 1
      - run: echo "required checks satisfied"
