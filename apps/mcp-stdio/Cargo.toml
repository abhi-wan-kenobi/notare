[package]
name = "notare-mcp"
version = "0.1.0"
edition = "2024"
description = "Stdio to HTTP bridge for Notare MCP server"

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std"] }
tauri-plugin-mcp-server = { workspace = true }
