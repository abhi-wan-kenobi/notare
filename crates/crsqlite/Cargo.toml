[package]
name = "crsqlite"
version = "0.1.0"
edition = "2024"

[build-dependencies]
# Hashes the vendored prebuilt binaries against vendor/SHA256SUMS at build
# time (the release pin recorded when the vlcn-io v0.16.3 assets were
# vendored) — a tampered/corrupted vendor file must fail the build, not the
# app's first run.
sha2 = { workspace = true }

[dependencies]
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }

[dev-dependencies]
# The Phase 0 spike harness (tests/common/spike.rs) drives the real schema
# (db-app + db-migrate), the real open path (db-core: Db::open + sqlite-vec
# registration) and the real update-hook wiring (db-change: ChangeNotifier).
# Dev-only: db-core depends on this crate, so these must not be normal deps.
hypr-db-app = { workspace = true }
hypr-db-change = { workspace = true }
hypr-db-core = { workspace = true }
hypr-db-migrate = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
