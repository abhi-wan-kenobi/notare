[package]
name = "db-core"
version = "0.1.0"
edition = "2024"

[features]
crsqlite = ["dep:hypr-crsqlite"]

[dependencies]
hypr-cloudsync = { workspace = true }
# Optional so builds without P2P sync do not embed the cr-sqlite binary;
# `tauri-plugin-db/sync` turns it on.
hypr-crsqlite = { workspace = true, optional = true }
hypr-db-change = { workspace = true }

backon = { workspace = true }
libsqlite3-sys = "0.35"
serde = { workspace = true, features = ["derive"] }
sqlite-vec = "0.1"
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
uuid = { workspace = true, features = ["v4"] }
