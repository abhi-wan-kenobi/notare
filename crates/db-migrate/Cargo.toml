[package]
name = "db-migrate"
version = "0.1.0"
edition = "2024"

[dependencies]
hypr-db-core = { workspace = true }

sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled", "migrate"] }
thiserror = { workspace = true }

[dev-dependencies]
# `CrrAlter` only opens an alter window with the cr-sqlite engine loaded.
hypr-crsqlite = { workspace = true }
hypr-db-core = { workspace = true, features = ["crsqlite"] }

tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
