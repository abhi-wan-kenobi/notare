[package]
name = "tauri-plugin-db"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/js", "/node_modules"]
links = "tauri-plugin-db"
description = ""

[features]
# SYNC-5: opt-in P2P sync. Turns on the sync-p2p dependency and cloudsync's
# from-source path (linux/x86_64 only until SYNC-9) — everything sync-related
# in this crate is additionally cfg-gated on target_os = "linux", so a default
# build is byte-identical in behavior to pre-SYNC-5 (no agent, no env vars,
# cloudsync_enabled: false). Must stay default-OFF: cargo unifies features
# across the workspace, and from-source panics on non-linux/x86_64 targets.
sync = ["dep:sync-p2p", "hypr-cloudsync/from-source"]

[dependencies]
hypr-agent-access = { workspace = true }
hypr-db-app = { workspace = true }
hypr-db-core = { workspace = true }
hypr-db-execute = { workspace = true }
hypr-db-migrate = { workspace = true }
hypr-db-reactive = { workspace = true, features = ["specta"] }
hypr-fs-sync-core = { workspace = true }
hypr-storage = { workspace = true }
hypr-tauri-utils = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true, features = ["serde_json"] }
specta-typescript = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled", "macros"] }
tauri = { workspace = true, features = ["test"] }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

# Target-gated like the from-source cloudsync build it enables: linux only.
# cloudsync is a dep only so the `sync` feature can turn on `from-source` —
# feature unification propagates it to db-core's hypr-cloudsync usage.
#
# This MUST come after the plain [dependencies] entries above. A `[target…]`
# table opened before them would swallow every following entry into the
# linux-x86_64 table, so on macOS/Windows the plain `serde`/`tauri`/`sqlx`/…
# would not resolve at all (the exact E0432/E0433 the macOS desktop_ci hit).
# Linux never surfaced it because both cfgs are true there.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
sync-p2p = { workspace = true, optional = true }
hypr-cloudsync = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

# SYNC-5 lifecycle-ordering test: drives the real from-source cloudsync
# extension + P2pAgent, so it is gated on the `sync` feature like the code it
# pins (linux/x86_64 only). Never compiled into a default test run.
[[test]]
name = "sync_lifecycle"
path = "tests/sync_lifecycle.rs"
required-features = ["sync"]

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
