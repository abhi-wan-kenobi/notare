[package]
name = "tauri-plugin-db"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/js", "/node_modules"]
links = "tauri-plugin-db"
description = ""

[features]
# Opt-in P2P sync: the sync-p2p agent plus the cr-sqlite engine (db-core's
# `crsqlite` feature, which embeds the vendored extension), on the app's
# CI-proven sync-platform gate (linux/x86_64, macOS aarch64/x86_64,
# windows/x86_64; see build-support/sync_app_gate.rs). Everything
# sync-related in this crate is additionally cfg-gated on `sync_platform`, so
# a default build opens the database without any extension. Must stay
# default-OFF: cargo unifies features across the workspace.
sync = ["dep:sync-p2p", "dep:hypr-crsqlite", "hypr-db-core/crsqlite"]

[dependencies]
hostname = "0.4"
hypr-agent-access = { workspace = true }
hypr-db-app = { workspace = true }
hypr-db-core = { workspace = true }
hypr-db-execute = { workspace = true }
hypr-db-migrate = { workspace = true }
hypr-db-reactive = { workspace = true, features = ["specta"] }
hypr-fs-sync-core = { workspace = true }
hypr-storage = { workspace = true }
hypr-tauri-utils = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true, features = ["serde_json"] }
specta-typescript = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled", "macros"] }
tauri = { workspace = true, features = ["test"] }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

# Target-gated to the app's CI-proven sync gate: linux/x86_64, macOS (both
# arches), windows/x86_64 — the four targets `crates/crsqlite/vendor/`
# carries a prebuilt engine for. linux/aarch64 has neither a vendored binary
# nor CI proof. Widen it here only once that changes.
#
# Cargo resolves `[target.'cfg(...)'.dependencies]` before any build script
# runs, so this cannot reference the `sync_platform` cfg emitted by
# `build.rs` (see build-support/sync_app_gate.rs) — this expression MUST stay
# textually identical to the twin table in
# apps/desktop/src-tauri/Cargo.toml, and semantically identical to
# `sync_app_gate_supported()` in build-support/sync_app_gate.rs.
#
# This MUST come after the plain [dependencies] entries above. A `[target…]`
# table opened before them would swallow every following entry into this
# table, so on targets outside this cfg the plain `serde`/`tauri`/`sqlx`/…
# would not resolve at all (the exact E0432/E0433 the macOS desktop_ci hit).
# Linux/x86_64 never surfaced it because both cfgs are true there.
[target.'cfg(any(all(target_os = "linux", target_arch = "x86_64"), all(target_os = "macos", target_arch = "aarch64"), all(target_os = "macos", target_arch = "x86_64"), all(target_os = "windows", target_arch = "x86_64")))'.dependencies]
sync-p2p = { workspace = true, optional = true }
hypr-crsqlite = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

# Lifecycle test: drives the real cr-sqlite engine + loopback P2pAgents, so
# it is gated on the `sync` feature like the code it pins.
[[test]]
name = "sync_lifecycle"
path = "tests/sync_lifecycle.rs"
required-features = ["sync"]

[[test]]
name = "change_source"
path = "tests/change_source.rs"
required-features = ["sync"]

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
