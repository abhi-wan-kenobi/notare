packages:
  - apps/*
  - packages/*
  - plugins/*
  - examples/plugins/*
  - e2e/*

publicHoistPattern:
  - "!bun-types"
  - "!@types/bun"

# Security floors use caret ranges at the first patched version, not exact
# pins: an exact pin froze each package one patch below the next fix and
# reopened the Dependabot alert every time (2026-08-03 and 2026-11-25 sweeps).
overrides:
  # Exactly the first patched release: 1.43.1 breaks the editor under jsdom
  # (`takeRecords` of null, 10 tests in session/index.test.tsx).
  prosemirror-view: "1.42.3"
  # One copy of each, or editor types from different copies stop matching.
  prosemirror-model: "^1.25.13"
  prosemirror-transform: "^1.12.7"
  lightningcss: "1.30.1"
  basic-ftp: "5.3.1"
  fast-uri: "^3.1.9"
  fast-xml-builder: "1.1.7"
  hono: "^4.13.16"
  js-cookie: "3.0.7"
  linkify-it: "5.0.2"
  lodash: "4.18.1"
  "undici@6": "^6.29.1"
  "undici@7": "^7.30.1"
  ws: "8.21.0"
  dompurify: "^3.4.17"
  mermaid: "11.16.1"
  nanoid: "^3.3.18"
  markdown-it: "^14.3.3"
  uuid: "11.1.1"
  "uuid@13": "13.0.1"
  ip-address: "^10.7.4"
  fast-xml-parser: "^5.12.0"
  "@opentelemetry/core": "2.8.0"
  esbuild: "0.25.0"
  "esbuild@0.27": "0.28.1"
  "esbuild@0.28": "0.28.1"
  js-yaml: "^4.3.2"
  serialize-javascript: "^7.1.3"
  "brace-expansion@^1": "^1.1.21"
  "brace-expansion@^2": "^2.1.7"
  "brace-expansion@^5": "^5.0.12"
  seroval: "^1.6.10"
  seroval-plugins: "^1.6.10"
  tinypool: "^2.1.2"
  browserslist: "^4.28.7"
  source-map-js: "^1.2.2"
  decode-uri-component: "^0.5.1"
  "@humanfs/node": "^0.16.8"
  baseline-browser-mapping: "^2.11.0"
  "@ai-sdk/provider-utils@4": "^4.0.33"
  "tar@6": "7.5.20"
  "tar@7": "7.5.20"
  "@babel/core": "7.29.6"
  postcss: "8.5.23"

peerDependencyRules:
  allowedVersions:
    motion: "11"
    react: "19"
    "@lobehub/ui": "3.4.0"
    unist-util-visit: "5"
    esbuild: "0.25"

allowBuilds:
  "@infisical/cli": true
  "@parcel/watcher": true
  "@sentry/cli": true
  cbor-extract: true
  core-js: true
  dprint: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  netlify: true
  protobufjs: true
  puppeteer: true
  sharp: true
  supabase: true
  unix-dgram: true
